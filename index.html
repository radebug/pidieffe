<style>
:root{
  --bg:#f7f8fb;--surface:#fff;--text:#17191f;--muted:#737985;--line:#e7e9ef;
  --accent:#d9413a;--accent-dark:#b92e29;--shadow:0 14px 38px rgba(20,25,40,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.dark{--bg:#111318;--surface:#191c22;--text:#f4f5f7;--muted:#a5abb5;--line:#2a2e36;--shadow:0 14px 40px rgba(0,0,0,.25)}
.container{width:min(1180px,calc(100% - 32px));margin:auto}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:900;font-size:20px}
.brand-mark{width:43px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:#fff;font-size:14px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--text);cursor:pointer}
.hero{padding:78px 0 42px;background:radial-gradient(circle at 50% 0%,rgba(217,65,58,.1),transparent 42%)}
.hero-inner{text-align:center;max-width:830px}
.eyebrow{font-weight:900;letter-spacing:.15em;font-size:12px;color:var(--accent)}
h1{font-size:clamp(42px,6vw,67px);line-height:1.03;letter-spacing:-.045em;margin:14px 0 17px}
.hero p{font-size:18px;line-height:1.6;color:var(--muted);margin:0 auto 28px;max-width:720px}
.search-wrap{max-width:660px;margin:auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:0 18px}
.search-wrap span{font-size:24px;color:var(--muted)}
.search-wrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:18px 0}
.section{padding:52px 0 72px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}
.section-head h2{font-size:34px;letter-spacing:-.03em;margin:0}
#toolCount{font-size:13px;color:var(--muted)}
.tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tool-card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:21px;min-height:172px;cursor:pointer;transition:.2s;color:var(--text)}

.tool-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:rgba(217,65,58,.1);font-size:22px;margin-bottom:20px;font-weight:850}

.tool-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.tool-arrow{position:absolute;right:18px;top:18px;color:var(--muted)}
.tool-card.disabled{opacity:.6}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px}
.footer-inner{display:flex;justify-content:space-between;gap:24px}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.show{display:flex}
.modal-card{position:relative;width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-close{position:absolute;right:18px;top:14px;border:0;background:transparent;color:var(--muted);font-size:30px;cursor:pointer}
.modal-icon{font-size:31px}
.modal-card h2{font-size:30px;margin:9px 0 6px}
.modal-card>p{color:var(--muted)}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;margin-top:22px;border:2px dashed var(--line);border-radius:17px;padding:34px 20px;cursor:pointer;background:var(--bg)}
.dropzone.drag{border-color:var(--accent);background:rgba(217,65,58,.05)}
.drop-icon{font-size:32px;color:var(--accent);font-weight:900}
.dropzone span{color:var(--muted);font-size:13px}
.file-list{display:grid;gap:8px;margin:14px 0}
.file-item{display:flex;justify-content:space-between;gap:12px;background:var(--bg);padding:10px 12px;border-radius:10px;font-size:13px}
.file-item span:last-child{color:var(--muted)}
.primary-btn{width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:850;font-size:15px;padding:15px;cursor:pointer}
.primary-btn:hover{background:var(--accent-dark)}

.small-note{text-align:center;color:var(--muted);font-size:12px;min-height:18px}
#toolOptions{margin:14px 0}
#toolOptions label{display:grid;gap:7px;font-size:13px;font-weight:700;margin:10px 0}
#toolOptions input,#toolOptions select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 12px;outline:0}
.option-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warning-box{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--muted);font-size:12px;line-height:1.5}
.page-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:14px;max-height:390px;overflow:auto}
.page-thumb{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:grab;position:relative}
.page-thumb.dragging{opacity:.45}
.thumb-canvas-wrap{background:white;border-radius:6px;overflow:hidden}
.thumb-canvas-wrap canvas{width:100%;height:auto;display:block}
.thumb-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}
.thumb-handle{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.9);border-radius:7px;padding:2px 6px;color:#555}
.thumb-empty{grid-column:1/-1;color:var(--muted);font-size:13px;padding:20px;text-align:center}
.organize-help{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12px}
.organize-help strong{color:var(--text)}
.hidden{display:none!important}
@media(max-width:900px){.tools-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.tools-grid{grid-template-columns:1fr}.section{padding:40px 0}.hero{padding-top:55px}.modal-card{padding:25px 18px}.option-row{grid-template-columns:1fr}.footer-inner{flex-direction:column}h1{font-size:42px}}

/* PDF editor */
.editor-shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;margin-top:14px}.modal.edit-mode .modal-card{width:100%;max-width:none;height:100vh;max-height:none;border-radius:0;margin:0;display:flex;flex-direction:column}.modal.edit-mode .modal-body{flex:1;overflow:hidden;display:flex;flex-direction:column}.modal.edit-mode #toolOptions{flex:1;overflow:hidden;display:flex;flex-direction:column}.modal.edit-mode #pdfEditorMount{flex:1;overflow:hidden;display:flex;flex-direction:column}.modal.edit-mode .editor-shell{flex:1;min-height:0}.modal.edit-mode .editor-stage-wrap{max-height:none;height:100%;overflow:auto}.modal.edit-mode .editor-pages{max-height:none;height:100%;overflow:auto}

.editor-pages{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding-right:3px}
.editor-page-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;cursor:pointer;color:var(--text)}
.editor-page-btn.active{border-color:var(--accent)}
.editor-page-btn canvas{width:100%;height:auto;display:block;border-radius:5px;background:#fff}

@media(max-width:720px){.editor-shell{grid-template-columns:1fr}.editor-pages{flex-direction:row;max-height:none;overflow:auto}.editor-page-btn{min-width:90px}.editor-stage-wrap{max-height:520px}}

/* v12 continuous PDF editor */
.editor-shell{grid-template-columns:180px minmax(0,1fr);min-height:0}

 .editor-shell{grid-template-columns:1fr}

.editor-existing-text{

<body>
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="#"><span class="brand-mark">P</span><span>PIDIEFFE</span></a>
    <button class="icon-btn" id="themeBtn" aria-label="Cambia tema">◐</button>
  </div>
</header>

<main>
<section class="hero">
  <div class="container hero-inner">
    <span class="eyebrow">PIDIEFFE</span>
    <h1>Strumenti PDF semplici e veloci.</h1>
    <p>Unisci, dividi, converti, comprimi e organizza i tuoi PDF direttamente dal browser.</p>
    <div class="search-wrap"><span>⌕</span><input id="toolSearch" type="search" placeholder="Cerca uno strumento..."></div>
  </div>
</section>

<section class="container section">
  <div class="section-head"><h2>Strumenti</h2><span id="toolCount">14 strumenti</span></div>

  <!-- Le card sono nell'HTML: compaiono anche se JavaScript/CDN non si caricano -->
  <div class="tools-grid" id="toolsGrid">
    <button class="tool-card" data-id="merge" data-search="unisci pdf combina documenti"><span class="tool-arrow">↗</span><div class="tool-icon">⧉</div><h3>Unisci PDF</h3><p>Combina più PDF in un unico documento.</p></button>
    <button class="tool-card" data-id="split" data-search="dividi pdf separa pagine"><span class="tool-arrow">↗</span><div class="tool-icon">✂</div><h3>Dividi PDF</h3><p>Separa pagine o intervalli di pagine.</p></button>
    <button class="tool-card" data-id="compress" data-search="comprimi pdf riduci peso"><span class="tool-arrow">↗</span><div class="tool-icon">⇲</div><h3>Comprimi PDF</h3><p>Riduci le dimensioni del tuo PDF.</p></button>
    <button class="tool-card" data-id="pdfjpg" data-search="pdf jpg immagine converti"><span class="tool-arrow">↗</span><div class="tool-icon">▧</div><h3>PDF in JPG</h3><p>Converti le pagine PDF in immagini JPG.</p></button>
    <button class="tool-card" data-id="pdftoword" data-search="pdf word docx converti"><span class="tool-arrow">↗</span><div class="tool-icon">W</div><h3>PDF in Word</h3><p>Crea un documento Word modificabile dal testo del PDF.</p></button>
    <button class="tool-card" data-id="jpgtopdf" data-search="jpg pdf png immagini converti"><span class="tool-arrow">↗</span><div class="tool-icon">▣</div><h3>JPG in PDF</h3><p>Crea un PDF partendo dalle tue immagini.</p></button>
    <button class="tool-card" data-id="rotate" data-search="ruota pdf gira pagine"><span class="tool-arrow">↗</span><div class="tool-icon">↻</div><h3>Ruota PDF</h3><p>Ruota facilmente tutte le pagine.</p></button>
    <button class="tool-card" data-id="number" data-search="numeri pagina pdf numerazione"><span class="tool-arrow">↗</span><div class="tool-icon">#</div><h3>Numeri di pagina</h3><p>Inserisci numeri di pagina nel PDF.</p></button>
    <button class="tool-card" data-id="watermark" data-search="filigrana watermark pdf"><span class="tool-arrow">↗</span><div class="tool-icon">◇</div><h3>Filigrana</h3><p>Aggiungi testo come filigrana.</p></button>

<script>
(function(){
"use strict";

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const modal=$("#toolModal"),fileInput=$("#fileInput"),dropzone=$("#dropzone"),fileList=$("#fileList"),processBtn=$("#processBtn"),statusText=$("#statusText"),toolOptions=$("#toolOptions");
let selectedTool=null, files=[], pageOrderState=[];
let editorState=null;

const meta={
 merge:{icon:"⧉",name:"Unisci PDF",desc:"Combina più PDF in un unico documento.",accept:".pdf"},
 split:{icon:"✂",name:"Dividi PDF",desc:"Separa pagine o intervalli di pagine.",accept:".pdf"},
 compress:{icon:"⇲",name:"Comprimi PDF",desc:"Riduci le dimensioni rasterizzando le pagine.",accept:".pdf"},
 pdfjpg:{icon:"▧",name:"PDF in JPG",desc:"Converti le pagine PDF in immagini JPG.",accept:".pdf"},
 pdftoword:{icon:"W",name:"PDF in Word",desc:"Estrai il testo dal PDF e crea un DOCX modificabile.",accept:".pdf"},
 jpgtopdf:{icon:"▣",name:"JPG in PDF",desc:"Crea un PDF partendo dalle tue immagini.",accept:"image/jpeg,image/png,image/webp"},
 rotate:{icon:"↻",name:"Ruota PDF",desc:"Ruota facilmente tutte le pagine.",accept:".pdf"},
 number:{icon:"#",name:"Numeri di pagina",desc:"Inserisci numeri di pagina nel PDF.",accept:".pdf"},
 watermark:{icon:"◇",name:"Filigrana",desc:"Aggiungi testo come filigrana.",accept:".pdf"},
 extract:{icon:"⇱",name:"Estrai pagine",desc:"Crea un nuovo PDF con le pagine selezionate.",accept:".pdf"},
 edit:{icon:"✎",name:"Modifica PDF",desc:"Modifica il testo esistente, aggiungi testo, evidenzia e disegna direttamente nel browser.",accept:".pdf"},
 organize:{icon:"☷",name:"Organizza PDF",desc:"Riordina le pagine con miniature e drag & drop.",accept:".pdf"},
 protect:{icon:"🔒",name:"Proteggi PDF",desc:"Funzione che richiede backend.",accept:".pdf"},
 unlock:{icon:"🔓",name:"Sblocca PDF",desc:"Funzione che richiede backend.",accept:".pdf"}
};

function optionHtml(id){
 if(["split","extract"].includes(id)) return '<label>Pagine / intervalli<input id="pageSpec" placeholder="es. 1-3,5,8-10"></label>';
 if(id==="rotate") return '<label>Rotazione<select id="rotation"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label>';
 if(id==="watermark") return '<label>Testo filigrana<input id="watermarkText" value="CONFIDENTIAL"></label><div class="option-row"><label>Dimensione<input id="watermarkSize" type="number" value="48" min="10" max="120"></label><label>Opacità<input id="watermarkOpacity" type="number" value="0.18" min=".05" max="1" step=".05"></label></div>';
 if(id==="number") return '<div class="option-row"><label>Posizione<select id="numberPos"><option value="bottom">In basso</option><option value="top">In alto</option></select></label><label>Dimensione<input id="numberSize" type="number" value="11" min="6" max="30"></label></div>';
 if(id==="compress") return '<div class="option-row"><label>Qualità JPG<select id="quality"><option value=".55">Alta compressione</option><option value=".72" selected>Bilanciata</option><option value=".88">Alta qualità</option></select></label><label>Risoluzione<select id="scale"><option value="1">Standard</option><option value="1.4" selected>Buona</option><option value="2">Alta</option></select></label></div><div class="warning-box">La compressione rasterizza le pagine: il testo non rimane selezionabile.</div>';
 if(id==="pdftoword") return `
 <div class="warning-box" id="wordModeHelp">
   <strong>PDF → Word reale:</strong> conversione eseguita nel browser con LibreOffice WebAssembly. Il primo avvio può richiedere qualche secondo per caricare il motore.
 </div>
 <div class="option-row">
   <label>Formato
     <select id="wordMode">
       <option value="wasm" selected>DOCX modificabile</option>
       <option value="layout">Copia visiva nel Word</option>
     </select>
   </label>
 </div>`;
 if(id==="edit") return `

function need(lib,msg){if(!lib){statusText.textContent=msg;return false}return true}
async function ab(f){return await f.arrayBuffer()}
function download(data,name,type="application/pdf"){const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function parseSpec(spec,max){if(!spec.trim())return [...Array(max)].map((_,i)=>i);const out=[];for(const raw of spec.split(",")){const p=raw.trim();if(!p)continue;if(p.includes("-")){let[a,b]=p.split("-").map(Number);if(!a||!b)throw Error("Intervallo non valido");if(a>b)[a,b]=[b,a];for(let i=a;i<=b;i++)out.push(i-1)}else{const n=Number(p);if(!n)throw Error("Pagina non valida");out.push(n-1)}}if(out.some(i=>i<0||i>=max))throw Error("Le pagine devono essere tra 1 e "+max);return out}

processBtn.onclick=async()=>{

 if(["merge","split","extract","rotate","watermark","number","organize"].includes(id)&&!need(window.PDFLib,"Libreria PDF non caricata. Controlla la connessione e ricarica."))return;
 if(["pdfjpg","compress","pdftoword","organize"].includes(id)&&!need(window.pdfjsLib,"Motore PDF non caricato. Controlla la connessione e ricarica."))return;
 if(["jpgtopdf","compress"].includes(id)&&!need(window.jspdf,"Motore immagini/PDF non caricato."))return;
 if(id==="pdftoword"&&!need(window.JSZip,"Motore Word locale non disponibile."))return;
 processBtn.disabled=true; statusText.textContent="Elaborazione in corso...";
 try{
  if(id==="merge")await mergePDFs();
  else if(id==="split")await splitPDF();
  else if(id==="extract")await extractPDF();
  else if(id==="rotate")await rotatePDF();
  else if(id==="watermark")await watermarkPDF();

  else if(id==="organize")await organizePDF();
  else if(id==="jpgtopdf")await imagesToPdf();
  else if(id==="pdfjpg")await pdfToJpg();

 }catch(err){console.error(err);statusText.textContent="Errore: "+(err.message||"operazione non riuscita")}
 finally{processBtn.disabled=false}

async function mergePDFs(){const {PDFDocument}=PDFLib,out=await PDFDocument.create();for(const f of files){const src=await PDFDocument.load(await ab(f));const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}download(await out.save(),"pdf-uniti.pdf")}
async function splitPDF(){const {PDFDocument}=PDFLib,src=await PDFDocument.load(await ab(files[0])),idx=parseSpec($("#pageSpec").value,src.getPageCount());for(const i of idx){const out=await PDFDocument.create(),[p]=await out.copyPages(src,[i]);out.addPage(p);download(await out.save(),"pagina-"+(i+1)+".pdf")}}
async function extractPDF(){const {PDFDocument}=PDFLib,src=await PDFDocument.load(await ab(files[0])),idx=parseSpec($("#pageSpec").value,src.getPageCount()),out=await PDFDocument.create();(await out.copyPages(src,idx)).forEach(p=>out.addPage(p));download(await out.save(),"pagine-estratte.pdf")}
async function rotatePDF(){const {PDFDocument,degrees}=PDFLib,doc=await PDFDocument.load(await ab(files[0])),add=Number($("#rotation").value);doc.getPages().forEach(p=>p.setRotation(degrees((p.getRotation().angle+add)%360)));download(await doc.save(),"pdf-ruotato.pdf")}
async function watermarkPDF(){const {PDFDocument,StandardFonts,rgb,degrees}=PDFLib,doc=await PDFDocument.load(await ab(files[0])),font=await doc.embedFont(StandardFonts.HelveticaBold),text=$("#watermarkText").value||"CONFIDENTIAL",size=Number($("#watermarkSize").value)||48,opacity=Number($("#watermarkOpacity").value)||.18;doc.getPages().forEach(p=>{const {width,height}=p.getSize(),tw=font.widthOfTextAtSize(text,size);p.drawText(text,{x:(width-tw)/2,y:height/2,size,font,color:rgb(.45,.45,.45),opacity,rotate:degrees(35)})});download(await doc.save(),"pdf-filigrana.pdf")}
async function numberPDF(){const {PDFDocument,StandardFonts,rgb}=PDFLib,doc=await PDFDocument.load(await ab(files[0])),font=await doc.embedFont(StandardFonts.Helvetica),size=Number($("#numberSize").value)||11,top=$("#numberPos").value==="top";doc.getPages().forEach((p,i)=>{const t=String(i+1),{width,height}=p.getSize(),tw=font.widthOfTextAtSize(t,size);p.drawText(t,{x:(width-tw)/2,y:top?height-25:18,size,font,color:rgb(.2,.2,.2)})});download(await doc.save(),"pdf-numerato.pdf")}
async function organizePDF(){const {PDFDocument}=PDFLib,src=await PDFDocument.load(await ab(files[0])),idx=pageOrderState.length?pageOrderState:[...Array(src.getPageCount())].map((_,i)=>i),out=await PDFDocument.create();(await out.copyPages(src,idx)).forEach(p=>out.addPage(p));download(await out.save(),"pdf-organizzato.pdf")}
function dataURL(f){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function dims(src){return new Promise((res,rej)=>{const i=new Image;i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight});i.onerror=rej;i.src=src})}
async function imagesToPdf(){const {jsPDF}=jspdf;let pdf=null;for(const f of files){const data=await dataURL(f),d=await dims(data),land=d.w>=d.h,w=land?297:210,h=land?210:297;if(!pdf)pdf=new jsPDF({orientation:land?"landscape":"portrait",unit:"mm",format:"a4"});else pdf.addPage("a4",land?"landscape":"portrait");const r=Math.min(w/d.w,h/d.h),iw=d.w*r,ih=d.h*r;pdf.addImage(data,f.type.includes("png")?"PNG":"JPEG",(w-iw)/2,(h-ih)/2,iw,ih)}pdf.save("immagini-convertite.pdf")}
async function pdfToJpg(){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await ab(files[0]))}).promise;for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),vp=p.getViewport({scale:1.8}),c=document.createElement("canvas");c.width=Math.max(1,Math.ceil(vp.width));c.height=Math.max(1,Math.ceil(vp.height));await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));download(blob,"pagina-"+n+".jpg","image/jpeg")}}
async function compressPDF(){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await ab(files[0]))}).promise,{jsPDF}=jspdf,q=Number($("#quality").value),scale=Number($("#scale").value);let out=null;for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),vp=p.getViewport({scale}),c=document.createElement("canvas");c.width=Math.max(1,Math.ceil(vp.width));c.height=Math.max(1,Math.ceil(vp.height));await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;const img=c.toDataURL("image/jpeg",q),land=vp.width>=vp.height,w=land?297:210,h=land?210:297;if(!out)out=new jsPDF({orientation:land?"landscape":"portrait",unit:"mm",format:"a4",compress:true});else out.addPage("a4",land?"landscape":"portrait");const r=Math.min(w/vp.width,h/vp.height),iw=vp.width*r,ih=vp.height*r;out.addImage(img,"JPEG",(w-iw)/2,(h-ih)/2,iw,ih,undefined,"FAST")}out.save("pdf-compresso.pdf")}

function currentVisibleEditorPage(){
 const scroller=$("#editorScroll");
 const stages=$$(".editor-page-stage");
 if(!scroller||!stages.length)return 1;
 const sr=scroller.getBoundingClientRect();
 let best=1,bestDist=Infinity;
 stages.forEach(s=>{
  const r=s.getBoundingClientRect();
  const d=Math.abs(r.top-sr.top-12);
  if(d<bestDist){bestDist=d;best=Number(s.dataset.page)}
 });
 return best;
}

function editorFitScale(page){
 const scroller=$("#editorScroll");
 const vp=page.getViewport({scale:1});
 const avail=Math.max(320,(scroller?.clientWidth||1200)-20);
 return Math.min(2.2,avail/vp.width);
}

async function rerenderEditorWithZoom(){
 const scroller=$("#editorScroll"),p=currentVisibleEditorPage();
 await renderAllEditorPages();
 requestAnimationFrame(()=>document.querySelector(`.editor-page-stage[data-page="${p}"]`)?.scrollIntoView({block:"start"}));
 const pct=$("#zoomPercent");
 if(pct)pct.value=String(Math.round(editorState.fit?100:editorState.zoom*100));
}

async function renderAllEditorPages(){
 const stack=$("#editorPagesStack"); if(!stack)return;
 stack.innerHTML="";
 for(let p=1;p<=editorState.pdf.numPages;p++){
  const page=await editorState.pdf.getPage(p);
  const scale=editorState.fit?editorFitScale(page):editorState.zoom;
  const vp=page.getViewport({scale});
  editorState.pageViews[p]={scale,width:vp.width,height:vp.height};

  const stage=document.createElement("div");
  stage.className="editor-page-stage";stage.dataset.page=p;
  stage.style.width=vp.width+"px";stage.style.height=vp.height+"px";
  stage.innerHTML=`
   <canvas class="pdf-page-canvas" data-pdf-page="${p}"></canvas>
   <div class="editor-text-layer" data-text-layer="${p}"></div>
   <canvas class="editor-overlay" data-overlay-page="${p}"></canvas>
   <div class="editor-page-label">Pagina ${p}</div>`;
  stack.appendChild(stage);

  const canvas=stage.querySelector(".pdf-page-canvas");
  const overlay=stage.querySelector(".editor-overlay");
  canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
  overlay.width=Math.ceil(vp.width);overlay.height=Math.ceil(vp.height);
  canvas.style.width=overlay.style.width=vp.width+"px";
  canvas.style.height=overlay.style.height=vp.height+"px";

  await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
  await buildEditableTextLayer(page,vp,p);
  renderNewTextsForPage(p);
  bindPageOverlay(overlay,p);
  await drawEditorOverlayForPage(p);
 }
 updateEditorPointerModes();
 const pct=$("#zoomPercent");if(pct)pct.value=String(Math.round(editorState.fit?100:editorState.zoom*100));
}

async function renderSingleEditorPage(pageNum, rebuildText=false){
 const stage=document.querySelector(`.editor-page-stage[data-page="${pageNum}"]`);
 if(!stage)return;
 const page=await editorState.pdf.getPage(pageNum);
 const scale=editorState.fit?editorFitScale(page):editorState.zoom;
 const vp=page.getViewport({scale});
 editorState.pageViews[pageNum]={scale,width:vp.width,height:vp.height};
 stage.style.width=vp.width+"px";stage.style.height=vp.height+"px";

 const canvas=stage.querySelector(".pdf-page-canvas"),overlay=stage.querySelector(".editor-overlay");
 canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
 overlay.width=Math.ceil(vp.width);overlay.height=Math.ceil(vp.height);
 canvas.style.width=overlay.style.width=vp.width+"px";canvas.style.height=overlay.style.height=vp.height+"px";
 await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
 await buildEditableTextLayer(page,vp,pageNum);
 renderNewTextsForPage(pageNum);
 await drawEditorOverlayForPage(pageNum);
 updateEditorPointerModes();
}

function updateEditorPointerModes(){
 $$(".editor-overlay").forEach(o=>{
  const geometric=["whiteout","highlight","draw","text"].includes(editorState.tool);
  o.style.pointerEvents=geometric?"auto":"none";
  o.style.cursor=editorState.tool==="text"?"text":"crosshair";
 });
 $$(".editor-text-layer").forEach(l=>{
  l.style.pointerEvents=editorState.tool==="edittext"?"auto":"none";

async function buildEditableTextLayer(page,vp,pageNum){

function pointOnOverlay(e,overlay){

}

function rectOp(type,a,b){return{type,x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)}}

function bindPageOverlay(overlay,pageNum){
 let drawing=false,start=null,current=null;
 overlay.addEventListener("pointerdown",e=>{
  const p=pointOnOverlay(e,overlay);
  if(editorState.tool==="text"){createNewText(pageNum,p.x,p.y);return}
  if(!["whiteout","highlight","draw"].includes(editorState.tool))return;
  drawing=true;overlay.setPointerCapture(e.pointerId);start=p;current={points:[p]};
 });
 overlay.addEventListener("pointermove",e=>{
  if(!drawing)return;const p=pointOnOverlay(e,overlay);
  if(editorState.tool==="draw")current.points.push(p);else current.end=p;
  drawEditorOverlayForPage(pageNum,current);
 });
 overlay.addEventListener("pointerup",async e=>{
  if(!drawing)return;drawing=false;const p=pointOnOverlay(e,overlay);
  if(editorState.tool==="draw"){
   if(current.points.length<2)current.points.push(p);
   editorState.ops[pageNum].push({type:"draw",points:current.points,color:editorState.color,width:editorState.stroke});
  }else if(editorState.tool==="whiteout"){
   editorState.ops[pageNum].push(rectOp("whiteout",start,p));
  }else if(editorState.tool==="highlight"){

async function drawEditorOverlayForPage(pageNum,preview=null){

  if(op.type==="whiteout"){ctx.fillStyle="#fff";ctx.fillRect(op.x,op.y,op.w,op.h)}
  else if(op.type==="highlight"){ctx.save();ctx.globalAlpha=.28;ctx.fillStyle=op.color||"#ffff00";ctx.fillRect(op.x,op.y,op.w,op.h);ctx.restore()}
  else if(op.type==="draw"&&op.points?.length){

   for(let i=1;i<op.points.length;i++)ctx.lineTo(op.points[i].x,op.points[i].y);ctx.stroke();
  }
 }
}

async function saveEditedPdf(){

 const source=await PDFLib.PDFDocument.load(editorState.bytes.slice());
 const out=await PDFLib.PDFDocument.create();

 for(let p=1;p<=source.getPageCount();p++){
  const changed=(editorState.textEdits[p]||[]).some(x=>x.text!==x.original)||(editorState.newTexts[p]||[]).some(x=>x.text?.trim())||(editorState.ops[p]||[]).length>0;
  if(!changed){
   const [cp]=await out.copyPages(source,[p-1]);
   out.addPage(cp);
   continue;
  }
  const pdfPage=await editorState.pdf.getPage(p);
  const renderVp=pdfPage.getViewport({scale:2.2});
  const canvas=document.createElement("canvas");
  canvas.width=Math.ceil(renderVp.width);canvas.height=Math.ceil(renderVp.height);
  const ctx=canvas.getContext("2d");
  await pdfPage.render({canvasContext:ctx,viewport:renderVp}).promise;

  const view=editorState.pageViews[p]||{width:renderVp.width/2.2,height:renderVp.height/2.2};
  const sx=canvas.width/view.width,sy=canvas.height/view.height;

  for(const ed of editorState.textEdits[p]||[]){
   if(ed.text===ed.original)continue;
   ctx.fillStyle="#fff";ctx.fillRect(ed.x*sx,ed.y*sy,Math.max(2,ed.w*sx),Math.max(2,ed.h*sy));
   ctx.fillStyle="#111";ctx.textBaseline="top";ctx.font=`${Math.max(8,ed.size*sy)}px Arial`;
   ctx.fillText(ed.text||"",ed.x*sx,ed.y*sy);
  }

  for(const nt of editorState.newTexts[p]||[]){
   if(!nt.text?.trim())continue;
   ctx.fillStyle=nt.color||"#000";ctx.textBaseline="top";ctx.font=`${Math.max(8,nt.size*sy)}px Arial`;
   nt.text.split(/\n/).forEach((line,i)=>ctx.fillText(line,nt.x*sx,(nt.y+i*nt.size*1.15)*sy));
  }

  for(const op of editorState.ops[p]||[]){
   if(op.type==="whiteout"){ctx.fillStyle="#fff";ctx.fillRect(op.x*sx,op.y*sy,op.w*sx,op.h*sy)}
   else if(op.type==="highlight"){ctx.save();ctx.globalAlpha=.28;ctx.fillStyle=op.color||"#ff0";ctx.fillRect(op.x*sx,op.y*sy,op.w*sx,op.h*sy);ctx.restore()}
   else if(op.type==="draw"&&op.points?.length>1){
    ctx.strokeStyle=op.color||"#000";ctx.lineWidth=(op.width||3)*sx;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(op.points[0].x*sx,op.points[0].y*sy);
    for(let i=1;i<op.points.length;i++)ctx.lineTo(op.points[i].x*sx,op.points[i].y*sy);
    ctx.stroke();
   }
  }

  const jpg=canvas.toDataURL("image/jpeg",0.96);
  const img=await out.embedJpg(jpg);
  const {width,height}=source.getPage(p-1).getSize();
  const np=out.addPage([width,height]);
  np.drawImage(img,{x:0,y:0,width,height});

}

const PIDIEFFE_CONVERTER_URL="https://erseco.github.io/document-converter/";
let pidieffeConverterReady=false;
let pidieffeConverterWaiters=[];
let pidieffeConversionRequests=new Map();

function ensurePidieffeConverter(){
 let iframe=document.getElementById("pidieffeConverterFrame");
 if(!iframe){
   iframe=document.createElement("iframe");
   iframe.id="pidieffeConverterFrame";
   iframe.src=PIDIEFFE_CONVERTER_URL;
   iframe.title="PIDIEFFE document conversion engine";
   iframe.setAttribute("aria-hidden","true");
   iframe.style.cssText="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10000px;top:-10000px;border:0";
   document.body.appendChild(iframe);
 }
 return iframe;
}

window.addEventListener("message",(event)=>{
 if(event.origin!=="https://erseco.github.io") return;
 const data=event.data||{};
 if(data.type==="ready"){
   pidieffeConverterReady=true;
   for(const w of pidieffeConverterWaiters.splice(0)) w.resolve();
   return;
 }
 if(data.type==="result" && data.requestId && pidieffeConversionRequests.has(data.requestId)){
   const req=pidieffeConversionRequests.get(data.requestId);
   clearTimeout(req.timer);
   pidieffeConversionRequests.delete(data.requestId);
   req.resolve(new Blob([data.data],{type:data.mimeType||"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}));
   return;
 }
 if(data.type==="error" && data.requestId && pidieffeConversionRequests.has(data.requestId)){
   const req=pidieffeConversionRequests.get(data.requestId);
   clearTimeout(req.timer);
   pidieffeConversionRequests.delete(data.requestId);
   req.reject(new Error(data.error||"Conversione non riuscita."));
 }
});

function waitPidieffeConverter(timeout=90000){
 ensurePidieffeConverter();
 if(pidieffeConverterReady) return Promise.resolve();
 return new Promise((resolve,reject)=>{
   const item={resolve,reject};
   pidieffeConverterWaiters.push(item);
   setTimeout(()=>{
     const i=pidieffeConverterWaiters.indexOf(item);
     if(i>=0)pidieffeConverterWaiters.splice(i,1);
     if(!pidieffeConverterReady)reject(new Error("Il motore LibreOffice WebAssembly non si è avviato. Ricarica la pagina e riprova."));
   },timeout);
 });
}

function convertWithPidieffeWasm(buffer,format="docx",timeout=180000){
 const iframe=ensurePidieffeConverter();
 return new Promise((resolve,reject)=>{
   const requestId="pidieffe_"+Date.now()+"_"+Math.random().toString(36).slice(2);
   const timer=setTimeout(()=>{
     pidieffeConversionRequests.delete(requestId);
     reject(new Error("Conversione scaduta. Prova con un PDF più piccolo."));
   },timeout);
   pidieffeConversionRequests.set(requestId,{resolve,reject,timer});
   iframe.contentWindow.postMessage({
     type:"convert",
     buffer,
     format,
     requestId
   },"https://erseco.github.io");
 });
}

  })).sort((a,b)=>Math.abs(b.y-a.y)>3?b.y-a.y:a.x-b.x);

  const lines=[];
  for(const it of items){let ln=lines.find(l=>Math.abs(l.y-it.y)<=3);if(!ln){ln={y:it.y,items:[]};lines.push(ln)}ln.items.push(it)}
  lines.sort((a,b)=>b.y-a.y);

  for(const ln of lines){
   ln.items.sort((a,b)=>a.x-b.x); let runs="";
   for(const it of ln.items){
    const bold=/bold|black|heavy|semibold|demi/i.test(it.fontName),italic=/italic|oblique/i.test(it.fontName);
    const sz=Math.max(14,Math.min(144,Math.round(it.fontSize*2)));
    runs+=`<w:r><w:rPr><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>${bold?"<w:b/>":""}${italic?"<w:i/>":""}</w:rPr><w:t xml:space="preserve">${xmlEscape(it.text)} </w:t></w:r>`;
   }
   body+=`<w:p><w:pPr><w:spacing w:after="80"/></w:pPr>${runs}</w:p>`;
  }
  if(p<pdf.numPages) body+=`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
 }

 zip.folder("word").file("document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>
</w:body></w:document>`);

 const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",compression:"DEFLATE"});
 download(blob,files[0].name.replace(/\.pdf$/i,"")+"-modificabile.docx","application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}

})();

window.addEventListener("load",()=>{
 setTimeout(()=>{try{ensurePidieffeConverter()}catch(e){}},1200);
});

</script>
