<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIDIEFFE — Powered by RAdebug</title>
  <meta name="description" content="PIDIEFFE — strumenti PDF online. Powered by RAdebug." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="#">
        <span class="brand-mark">P</span>
        <span>PIDIEFFE</span>
      </a>
      <div class="nav-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Cambia tema">◐</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero compact-hero">
      <div class="container hero-inner">
        <span class="eyebrow">PIDIEFFE</span>
        <h1>Strumenti PDF semplici e veloci.</h1>
        <p>Unisci, dividi, converti, comprimi e organizza i tuoi PDF direttamente dal browser.</p>

        <div class="search-wrap">
          <span>⌕</span>
          <input id="toolSearch" type="search" placeholder="Cerca uno strumento..." />
        </div>
      </div>
    </section>

    <section class="container section" id="tools">
      <div class="section-head">
        <div>
          <h2>Strumenti</h2>
        </div>
        <span id="toolCount"></span>
      </div>

      <div class="tools-grid" id="toolsGrid"></div>
    </section>
  </main>

  <div class="modal" id="toolModal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">×</button>

      <div class="modal-icon" id="modalIcon"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>

      <label class="dropzone" id="dropzone">
        <input id="fileInput" type="file" multiple hidden />
        <div class="drop-icon">⇧</div>
        <strong>Trascina i file qui</strong>
        <span>oppure clicca per selezionarli</span>
      </label>

      <div id="toolOptions"></div>
      <div id="pagePreview" class="page-preview"></div>
      <div id="fileList" class="file-list"></div>

      <button class="primary-btn" id="processBtn" disabled>Avvia strumento</button>
      <p class="small-note" id="statusText"></p>
    </div>
  </div>

  <footer class="minimal-footer">
    <div class="container footer-inner">
      <span>PIDIEFFE</span>
      <span>Powered by <strong>RAdebug</strong></span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
